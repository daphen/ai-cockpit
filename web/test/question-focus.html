<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question focus</title></head><body><div id="fixture"></div><output id="result">RUNNING</output><script type="module">
import React from 'react'
import {createRoot} from 'react-dom/client'
import '/src/theme.css'
localStorage.setItem('cockpit.bridgeToken','fixture-token')
localStorage.setItem('cockpit.lastSession','personal/ticket')
const sockets=[]
class Socket{
 static OPEN=1;static CONNECTING=0;readyState=1;sent=[]
 constructor(){sockets.push(this);setTimeout(()=>{this.onopen?.();this.receive({type:'roster',sessions:[{name:'ticket',cwd:'/tmp',status:'idle',taskTitle:'Focus fixture'}]})},0)}
 send(text){const message=JSON.parse(text);this.sent.push(message);if(message.type==='get_entries')setTimeout(()=>this.receive({type:'response',command:'get_entries',session:'ticket',data:{entries:[]}}),0)}
 receive(message){this.onmessage?.({data:JSON.stringify(message)})}
 close(){}
}
window.WebSocket=Socket
window.fetch=async url=>new Response(JSON.stringify(['personal']),{status:String(url).startsWith(location.origin)?200:503})
const {default:App}=await import('/src/App.tsx')
createRoot(document.querySelector('#fixture')).render(React.createElement(App))
const check=(value,message)=>{if(!value)throw new Error(message)}
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))
async function waitFor(get){for(let i=0;i<80;i++){const value=get();if(value)return value;await new Promise(resolve=>setTimeout(resolve,50))}throw new Error('Timed out waiting for element')}
try{
 const input=await waitFor(()=>document.querySelector('.composer-pill textarea'))
 const socket=sockets[0]
 socket.receive({type:'extension_ui_request',session:'ticket',method:'confirm',id:'ask-1',title:'Continue?'})
 const yes=await waitFor(()=>[...document.querySelectorAll('.ask-card button')].find(button=>button.textContent==='Approve'))
 yes.focus();yes.click();await frame()
 check(socket.sent.some(message=>message.type==='answer'),'answer not sent')
 check(input.disabled&&document.activeElement!==input,'focus returned before answer acknowledgment')
 socket.receive({type:'ask_answered',session:'ticket'});await frame()
 check(document.activeElement===input&&!input.disabled,'acknowledged question did not restore composer focus')
 socket.receive({type:'extension_ui_request',session:'ticket',method:'confirm',id:'ask-2',title:'Try again?'})
 const second=await waitFor(()=>[...document.querySelectorAll('.ask-card button')].find(button=>button.textContent==='Approve'))
 second.focus();second.click();socket.receive({type:'error',session:'ticket',error:'Not accepted'});await frame()
 check(document.querySelector('.ask-card')&&document.activeElement!==input,'rejected answer dismissed question or stole focus')
 document.querySelector('#result').textContent='PASS: real mobile App restores composer focus after accepted answers, not before acknowledgment or after rejection'
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.stack}
</script></body></html>
