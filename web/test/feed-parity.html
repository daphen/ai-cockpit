<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile parity</title></head><body><div id="fixture" style="width:390px;height:650px"></div><output id="result">RUNNING</output><script type="module">
import React from 'react'
import {createRoot} from 'react-dom/client'
import {LazyMotion,domAnimation,MotionConfig} from 'motion/react'
import {Feed} from '/src/Feed.tsx'
import '/src/theme.css'
const root=createRoot(document.querySelector('#fixture'))
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))
const check=(value,message)=>{if(!value)throw new Error(message)}
const activity=(id,tool,args,result='',details={})=>({kind:'activity',activity:{id,tool,args,label:tool==='bash'?args.command:args.path??tool,result,details,partial:false}})
const items=[{kind:'user',key:'u',text:'Question'},{kind:'user',key:'handoff',sender:'worker',text:'Full handoff\n'+'Detailed instructions. '.repeat(40)},{kind:'system',key:'mcp',text:'\x1b[38;5;109m🔌 MCP: 17 servers enabled (1 connected)\x1b[39m'},{kind:'turn',key:'a',items:[{kind:'text',text:'Before **bold** and `code`.\n```ts\nconst visible = true\n```'},activity('read','read',{path:'source.ts'},'File contents'),{kind:'text',text:'After read'},activity('one','edit',{path:'one.ts'},'Edited',{diff:'+1 new\n-1 old'}),activity('two','edit',{path:'two.ts'},'Edited',{diff:'+2 new'}),{kind:'thinking',text:'Reasoning contents'},activity('single','edit',{path:'single.ts'},'Edited',{diff:'+1 new'}),{...activity('failure','mcp',{tool:'linear_list_projects'},'Error: {"error":"invalid_request","message":"The query is too complex.","status":400,"requestId":"hidden-id"}'),activity:{...activity('failure','mcp',{}).activity,failed:true,result:'Error: {"error":"invalid_request","message":"The query is too complex.","status":400,"requestId":"hidden-id"}'}}]}]
try{
root.render(React.createElement(LazyMotion,{features:domAnimation},React.createElement(MotionConfig,{reducedMotion:'always'},React.createElement(Feed,{items}))))
await frame()
check(document.querySelectorAll('.file-table').length===1,'single edit incorrectly grouped')
check(document.querySelector('.file-table header').textContent.includes('+2'),'header totals missing')
const agent=document.querySelector('.agent-turn')
const children=[...agent.children]
check(children[0].classList.contains('agent-copy')&&children[1].classList.contains('tool-entry')&&children[2].textContent==='After read','prose/tool order changed')
check(document.querySelector('.code-block').textContent.includes('const visible = true'),'mobile code was hidden')
const summary=document.querySelector('.tool-error')
check(summary.textContent==='Invalid request\nThe query is too complex. · HTTP 400','error title/message not readable')
check(!summary.textContent.includes('requestId')&&!summary.textContent.includes('{'),'raw JSON leaked into preview')
const shell=document.querySelector('.system-turn').textContent
check(shell==='MCP: 17 servers enabled (1 connected)','ANSI housekeeping not cleaned')
const prose=children[0].getBoundingClientRect(),icon=document.querySelector('.tool-icon').getBoundingClientRect()
check(Math.abs(prose.left-icon.left)<1,'prose does not align with icon column')
check(getComputedStyle(document.querySelector('.turn-copy')).overflowWrap==='normal','letter wrapping restored')
const handoff=document.querySelector('.handoff-turn')
check(handoff.querySelector('.handoff-preview'),'handoff preview missing')
handoff.querySelector('button').click();await frame()
check(!handoff.querySelector('.handoff-preview'),'handoff full message not expandable')
const light=(color)=>{const rgb=color.match(/[\d.]+/g).slice(0,3).map(Number);return rgb.reduce((a,b)=>a+b,0)*(color.startsWith('color(')?255:1)}
const paint=document.createElement('span');paint.style.color='var(--bg-dim)';document.body.append(paint)
const table=light(getComputedStyle(document.querySelector('.file-table')).backgroundColor)
const canvas=light(getComputedStyle(paint).color)
const bubble=light(getComputedStyle(document.querySelector('.user-turn')).backgroundColor)
check(table>canvas&&table<bubble,'file table does not sit between canvas and user brightness')
paint.remove()
document.querySelector('[data-tool-id="failure"] > summary').click();await frame()
check(document.querySelector('[data-tool-id="failure"] .tool-output').textContent.includes('hidden-id'),'expanded raw details lost')
document.querySelector('#result').textContent='PASS: mobile ordering, code, file grouping/totals, readable errors, ANSI removal, alignment, word wrapping, handoff expansion and light/dark surfaces'
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.stack}
</script></body></html>
